[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rag-integrity"
version = "0.1.0"
description = "RAG Data Integrity & Reconciliation Platform - know when your RAG index is wrong before your users do."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "boto3>=1.34",
  "qdrant-client>=1.10",
  "httpx>=0.27",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "moto[s3,server]>=5.0",
  "ruff>=0.5",
]

[project.scripts]
ragi = "ragintegrity.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ragintegrity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
