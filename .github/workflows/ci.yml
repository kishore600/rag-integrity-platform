name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    services:
      # A real Postgres with the pgvector extension: runs the Supabase migrations, the Postgres ledger, the read-only manifest
      # connector and the read-only pgvector index connector (each test works in its own schema).
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      # A real Qdrant server enforcing an API key: tests the connector over HTTP (paging, filters, auth, probes).
      qdrant:
        image: qdrant/qdrant:v1.20.0
        env:
          QDRANT__SERVICE__API_KEY: ci-test-api-key
          QDRANT__TELEMETRY_DISABLED: "true"
        ports: ["6333:6333"]
    env:
      RAGI_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
      RAGI_TEST_PGVECTOR_URL: postgresql://postgres:postgres@localhost:5432/postgres
      RAGI_TEST_QDRANT_URL: http://localhost:6333
      RAGI_TEST_QDRANT_KEY: ci-test-api-key
      RAGI_TEST_S3_ENDPOINT: http://127.0.0.1:5556
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests examples api scripts
      - name: Start an S3 API over real HTTP (moto) and wait for Qdrant
        run: |
          nohup moto_server -H 127.0.0.1 -p 5556 > moto.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:5556/moto-api/ > /dev/null && curl -fsS -H "api-key: ci-test-api-key" http://localhost:6333/collections > /dev/null && exit 0
            sleep 2
          done
          echo "services did not come up"; cat moto.log; exit 1
      - run: pytest -p no:warnings

  frontend:
    name: Web interface (typecheck and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The built interface is committed (so Vercel and Docker need no Node step). It must match the source.
      - name: Built files are up to date
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain -- src/ragintegrity/api/static)" ]; then
            git status --short -- src/ragintegrity/api/static
            echo "The committed build in src/ragintegrity/api/static is out of date. Run 'npm run build' in frontend/ and commit the result."
            exit 1
          fi

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - name: Log in to GHCR (not on pull requests)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
